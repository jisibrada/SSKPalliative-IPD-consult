<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1f6bbf">
<title>ศูนย์ปันรักษ์ · PC Center (Firebase)</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#1f6bbf; --blue-d:#17539c; --pink:#e0167a; --sage2:#2f7a5f;
    --bg:#eef2f8; --bg2:#fff; --line:#e4e9f2; --line2:#cfd8ea;
    --text:#1f2b3d; --text2:#4a5a72; --text3:#8493aa; --text4:#a9b6ca;
    --amber:#f59e0b; --green:#16a34a; --purple:#8b5cf6; --gray:#6b7280; --slate:#94a3b8; --red:#dc2626; --rose:#e0167a;
    --font:'Sarabun',system-ui,sans-serif; --mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .err{color:var(--red)}

  .gate{position:fixed;inset:0;background:linear-gradient(140deg,#fde7f1,#e8f0fb);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}
  .gate-card{background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(30,60,110,.18);padding:32px 28px;width:100%;max-width:380px;text-align:center}
  .gate-logo{font-size:26px;font-weight:800;color:var(--pink)} .gate-logo span{color:var(--blue)}
  .gate-sub{font-size:12px;color:var(--text3);letter-spacing:.03em;margin-top:2px}
  .gate-badge{display:inline-block;margin-top:10px;font-size:10.5px;font-weight:700;color:#3730a3;background:#e0e7ff;border:1px solid #c7d2fe;padding:2px 10px;border-radius:20px}
  .gate h1{font-size:17px;font-weight:700;margin:22px 0 4px}
  .gate p.hint{font-size:12.5px;color:var(--text3);margin-bottom:18px}
  .fld{text-align:left;margin-bottom:12px}
  .fld label{display:block;font-size:12px;font-weight:700;color:var(--text2);margin-bottom:5px}
  .fld input,.fld select{width:100%;padding:11px 13px;border:1.5px solid var(--line2);border-radius:10px;font-family:inherit;font-size:15px;background:#fbfcfe}
  .fld input:focus,.fld select:focus{outline:none;border-color:var(--blue)}
  .gate-btn{width:100%;padding:12px;background:linear-gradient(120deg,var(--blue),var(--blue-d));color:#fff;border:none;border-radius:11px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px;transition:.15s}
  .gate-btn:hover{box-shadow:0 6px 18px rgba(31,107,191,.35)} .gate-btn:disabled{opacity:.6;cursor:not-allowed}
  .gate-msg{font-size:12.5px;font-weight:600;min-height:18px;margin-top:12px;color:var(--text3)}

  .app{display:none;min-height:100vh} .app.on{display:block}
  .topbar{background:linear-gradient(100deg,var(--blue),var(--blue-d));color:#fff;padding:13px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
  .topbar .logo{font-size:16px;font-weight:800}
  .topbar .rt{font-size:11px;background:rgba(255,255,255,.15);padding:3px 10px;border-radius:20px;display:flex;align-items:center;gap:5px}
  .topbar .rt .dot{width:7px;height:7px;border-radius:50%;background:#86efac;animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(134,239,172,.6)}70%{box-shadow:0 0 0 6px rgba(134,239,172,0)}100%{box-shadow:0 0 0 0 rgba(134,239,172,0)}}
  .topbar .who{margin-left:auto;font-size:12px;opacity:.92;text-align:right;line-height:1.25}
  .topbar .out{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;font-family:var(--font);font-size:12px;font-weight:700;padding:6px 12px;border-radius:20px;cursor:pointer}

  .tabs{display:flex;gap:6px;background:#fff;border-bottom:1px solid var(--line);padding:8px 20px;position:sticky;top:49px;z-index:19;overflow-x:auto}
  .tab{padding:8px 16px;border-radius:20px;font-size:13.5px;font-weight:700;color:var(--text2);cursor:pointer;white-space:nowrap;border:1px solid transparent}
  .tab.on{background:#e8f0fb;color:var(--blue-d);border-color:#c9ddf5}
  .tab .badge{margin-left:6px;font-size:11px;background:#eef2f8;color:var(--text3);border-radius:20px;padding:1px 7px}
  .tab.on .badge{background:var(--blue);color:#fff}

  .wrap{max-width:860px;margin:0 auto;padding:20px 18px 80px}
  .ph{margin-bottom:14px} .ph h2{font-size:19px;font-weight:800} .ph p{font-size:12.5px;color:var(--text3);margin-top:2px}
  .page{display:none} .page.on{display:block;animation:fade .2s ease}
  @keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

  .case{background:#fff;border:1px solid var(--line);border-radius:13px;margin-bottom:12px;overflow:hidden;border-left:3px solid var(--slate)}
  .case.waiting{border-left-color:var(--amber)} .case.caring{border-left-color:var(--green)}
  .case.discharge{border-left-color:var(--purple)} .case.death{border-left-color:var(--gray)} .case.unseen{border-left-color:var(--slate)}
  .cband{display:flex;align-items:center;gap:9px;padding:11px 15px;background:#f8fafc;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .cband .seq{width:24px;height:24px;border-radius:50%;background:#fff;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--text3)}
  .cband .nm{font-size:15.5px;font-weight:700} .cband .hn{font-size:12.5px;color:var(--text3);font-family:var(--mono)}
  .cband .reg{font-size:11.5px;font-weight:700;color:var(--blue);background:#e8f0fb;padding:1px 9px;border-radius:6px;font-family:var(--mono)}
  .urg{margin-left:auto;font-size:12px;font-weight:800;padding:3px 12px;border-radius:20px}
  .urg.em{background:#fee2e2;color:#b91c1c} .urg.ur{background:#fef3c7;color:#b45309} .urg.no{background:#dcfce7;color:#15803d}
  .cbody{padding:12px 15px;display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
  .cbody .info{flex:1;min-width:220px;font-size:13px;color:var(--text2)}
  .cbody .info .d2{font-size:12px;color:var(--text3);margin-top:3px}
  .cbody .reason{font-size:12.5px;font-weight:700;color:#b45309;margin-top:4px}
  .actbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:0 15px 13px}
  .agrp{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:5px 9px;border-radius:12px;background:#f6f9fd}
  .alabel{font-size:10px;font-weight:800;color:var(--text4);letter-spacing:.06em;text-transform:uppercase}
  .btn{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;cursor:pointer;font-family:var(--font);font-size:12.5px;font-weight:700;padding:7px 14px;border-radius:9px;border:1.5px solid transparent;background:#fff;color:var(--text2);transition:.14s}
  .btn:active{transform:translateY(1px)}
  .btn.accept{background:#16a34a;color:#fff;font-size:14px;padding:9px 22px;box-shadow:0 3px 10px rgba(22,163,74,.3)}
  .btn.neutral{border-color:var(--line2);color:var(--text2)} .btn.danger{border-color:#fca5a5;color:#dc2626} .btn.st{border-color:var(--line2)}
  .btn.tog{border-color:var(--line2)} .btn.tog.on-teal{background:#cffafe;border-color:#0891b2;color:#0e5c6b} .btn.tog.on-amber{background:#fef3c7;border-color:#f59e0b;color:#92400e}
  .empty{text-align:center;padding:44px 0;color:var(--text3)} .empty .ei{font-size:32px}
  .fab{position:fixed;right:18px;bottom:18px;z-index:30;background:var(--pink);color:#fff;border:none;border-radius:30px;padding:13px 20px;font-family:var(--font);font-size:14px;font-weight:800;box-shadow:0 6px 20px rgba(224,22,122,.4);cursor:pointer}

  .ov{display:none;position:fixed;inset:0;background:rgba(20,30,50,.45);z-index:120;align-items:center;justify-content:center;padding:16px}
  .ov.on{display:flex}
  .modal{background:#fff;border-radius:15px;padding:20px;width:100%;max-width:440px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 50px rgba(20,40,80,.25)}
  .modal h3{font-size:17px;font-weight:800;margin-bottom:12px}
  .modal .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .mact{display:flex;gap:9px;margin-top:16px} .mact .btn{flex:1;justify-content:center;padding:11px} .mact .go{background:var(--blue);color:#fff;border:none}
  .ropt{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px;cursor:pointer;font-size:14px}
  .ropt.sel{border-color:var(--blue);background:#eef5ff;font-weight:600}
  .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(80px);background:#1f2b3d;color:#fff;padding:11px 20px;border-radius:24px;font-size:13.5px;font-weight:600;z-index:200;opacity:0;transition:.35s}
  .toast.on{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-card">
    <div class="gate-logo">ศูนย์<span>ปันรักษ์</span></div>
    <div class="gate-sub">PALLIATIVE CARE · รพ.ศรีสะเกษ</div>
    <div class="gate-badge">● Firebase</div>
    <h1>เข้าสู่ระบบทีม PC</h1>
    <p class="hint">ล็อกอินด้วยอีเมล + รหัสที่ผู้ดูแลตั้งให้</p>
    <div class="fld"><label>อีเมล</label><input type="email" id="in-email" autocomplete="username" placeholder="you@example.com"></div>
    <div class="fld"><label>รหัสผ่าน</label><input type="password" id="in-pass" autocomplete="current-password" placeholder="password"></div>
    <button class="gate-btn" id="btn-login" onclick="doLogin()">เข้าสู่ระบบ</button>
    <div class="gate-msg" id="gate-msg"></div>
  </div>
</div>

<div class="app" id="app">
  <div class="topbar">
    <span class="logo">🌿 ศูนย์ปันรักษ์</span>
    <span class="rt"><span class="dot"></span>real-time</span>
    <div class="who" id="who"></div>
    <button class="out" onclick="doLogout()">ออก</button>
  </div>
  <div class="tabs">
    <div class="tab on" data-tab="queue" onclick="go('queue')">⏳ คิวรอรับ <span class="badge" id="b-queue">0</span></div>
    <div class="tab" data-tab="pc" onclick="go('pc')">🩺 ทีม PC <span class="badge" id="b-pc">0</span></div>
    <div class="tab" data-tab="unseen" onclick="go('unseen')">⏱ ไปดูไม่ทัน <span class="badge" id="b-unseen">0</span></div>
  </div>
  <div class="wrap">
    <div id="pg-queue" class="page on"></div>
    <div id="pg-pc" class="page"></div>
    <div id="pg-unseen" class="page"></div>
  </div>
  <button class="fab" onclick="openConsult()">➕ กรอกใบ Consult</button>
</div>

<div class="ov" id="consult-ov"><div class="modal">
  <h3>➕ กรอกใบ Consult</h3>
  <div style="font-size:11px;font-weight:800;color:var(--text4);letter-spacing:.05em;text-transform:uppercase;margin:2px 0 8px">ข้อมูลผู้ป่วย</div>
  <div class="grid2">
    <div class="fld"><label>ชื่อ-นามสกุล *</label><input id="c-name" placeholder="นายสมชาย ใจดี"></div>
    <div class="fld"><label>HN</label><input id="c-hn" placeholder="123456"></div>
  </div>
  <div class="grid2" style="margin-top:6px">
    <div class="fld"><label>อายุ (ปี)</label><input id="c-age" type="number" inputmode="numeric" placeholder="65"></div>
    <div class="fld"><label>เพศ</label><select id="c-sex"><option value="">—</option><option>ชาย</option><option>หญิง</option></select></div>
  </div>
  <div class="grid2" style="margin-top:6px">
    <div class="fld"><label>Ward</label><input id="c-ward" placeholder="อช.2"></div>
    <div class="fld"><label>วันที่ส่งปรึกษา</label><input id="c-date" type="date"></div>
  </div>
  <div class="fld" style="margin-top:6px"><label>ความเร่งด่วน</label><select id="c-urg"><option>Emergency</option><option selected>Urgency</option><option>ไม่ด่วน</option></select></div>

  <div style="font-size:11px;font-weight:800;color:var(--text4);letter-spacing:.05em;text-transform:uppercase;margin:14px 0 8px">ข้อมูลทางคลินิก</div>
  <div class="fld"><label>การวินิจฉัย (Dx)</label><input id="c-dx" placeholder="CA lung c bone mets"></div>
  <div class="fld" style="margin-top:6px"><label>ระยะ/การกระจาย (Staging)</label><input id="c-staging" placeholder="Stage IV"></div>
  <div class="fld" style="margin-top:6px"><label>โรคประจำตัว (Underlying)</label><input id="c-underlying" placeholder="HT, DM"></div>
  <div class="grid2" style="margin-top:6px">
    <div class="fld"><label>PPS (%)</label><select id="c-pps"><option value="">—</option><option>100</option><option>90</option><option>80</option><option>70</option><option>60</option><option>50</option><option>40</option><option>30</option><option>20</option><option>10</option></select></div>
    <div class="fld"><label>ECOG</label><select id="c-ecog"><option value="">—</option><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option></select></div>
  </div>
  <div class="fld" style="margin-top:6px"><label>Prognosis</label><select id="c-prognosis"><option value="">—</option><option>วัน (days)</option><option>สัปดาห์ (weeks)</option><option>เดือน (months)</option><option>ปี (years)</option><option>ไม่แน่นอน</option></select></div>

  <div style="font-size:11px;font-weight:800;color:var(--text4);letter-spacing:.05em;text-transform:uppercase;margin:14px 0 8px">แผน / ACP / เหตุผล</div>
  <div class="fld"><label>Goals of Care</label><select id="c-goc"><option value="">—</option><option>ประคับประคอง (Comfort)</option><option>มุ่งรักษาให้หาย (Curative)</option><option>ผสมผสาน (Mixed)</option></select></div>
  <div class="fld" style="margin-top:6px"><label>Advance Care Plan (ACP)</label><textarea id="c-acp" rows="2" placeholder="เช่น No CPR, Place of death: บ้าน" style="width:100%;padding:10px 12px;border:1.5px solid var(--line2);border-radius:9px;font-family:inherit;font-size:14px"></textarea></div>
  <div class="fld" style="margin-top:6px"><label>เหตุผลส่งปรึกษา</label><textarea id="c-reason" rows="2" placeholder="เช่น ปวดควบคุมไม่ได้, วางแผน goal of care" style="width:100%;padding:10px 12px;border:1.5px solid var(--line2);border-radius:9px;font-family:inherit;font-size:14px"></textarea></div>

  <div style="font-size:11px;font-weight:800;color:var(--text4);letter-spacing:.05em;text-transform:uppercase;margin:14px 0 8px">อื่น ๆ</div>
  <div class="fld"><label>ผู้ส่งปรึกษา (Staff)</label><input id="c-staff" placeholder="พว./นพ. ..."></div>
  <div class="fld" style="margin-top:6px"><label>หมายเหตุเพิ่มเติม</label><textarea id="c-notes" rows="2" placeholder="รายละเอียดเพิ่มเติม" style="width:100%;padding:10px 12px;border:1.5px solid var(--line2);border-radius:9px;font-family:inherit;font-size:14px"></textarea></div>

  <div class="mact"><button class="btn go" onclick="submitConsult()">บันทึกใบ Consult</button><button class="btn neutral" onclick="closeOv('consult-ov')">ยกเลิก</button></div>
</div></div>

<div class="ov" id="unseen-ov"><div class="modal" style="max-width:420px">
  <h3>⏱ ปิดเคส – ไปดูไม่ทัน</h3>
  <p id="u-name" style="font-size:13px;color:var(--text2);margin-bottom:12px;font-weight:600"></p>
  <div id="u-reasons"></div>
  <input id="u-note" placeholder="ระบุเหตุผล (สำหรับ อื่น ๆ)" style="width:100%;padding:10px;border:1.5px solid var(--line2);border-radius:9px;font-family:inherit;font-size:14px;margin-top:8px;display:none">
  <div class="mact"><button class="btn go" style="background:#64748b" onclick="submitUnseen()">ยืนยัน</button><button class="btn neutral" onclick="closeOv('unseen-ov')">ยกเลิก</button></div>
</div></div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, addDoc, updateDoc, collection, onSnapshot, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCrMbPuSgSuP_SpQ_jpj7OC9OGYnLamHCs",
  authDomain: "pc-center-ef83d.firebaseapp.com",
  projectId: "pc-center-ef83d",
  storageBucket: "pc-center-ef83d.firebasestorage.app",
  messagingSenderId: "264238393124",
  appId: "1:264238393124:web:27170d104c32a4576b35b1",
  measurementId: "G-GWEKJQCQS2"
};
const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app);
const patientsCol=collection(db,'patients');
const $=id=>document.getElementById(id);
let unsub=null, ME='', PATIENTS=[], view='queue', watchdog=null;

const STATUS={ waiting:{label:'⏳ รอรับ Consult',cls:'waiting'}, caring:{label:'🔄 กำลังดูแล',cls:'caring'}, discharge:{label:'🏠 Discharge',cls:'discharge'}, death:{label:'🕊 Death',cls:'death'}, unseen:{label:'⏱ ไปดูไม่ทัน',cls:'unseen'} };
const URG_ORDER={'Emergency':0,'Urgency':1,'ไม่ด่วน':2,'':3};
const UNSEEN_REASONS=['เสียชีวิตก่อนทีมประเมิน','Refer ออกก่อน','ปฏิเสธการรักษา','อื่น ๆ'];
const esc=v=>String(v==null?'':v).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

/* ── Auth ── */
window.doLogin=async function(){
  const email=$('in-email').value.trim(), pass=$('in-pass').value, msg=$('gate-msg');
  if(!email||!pass){ msg.className='gate-msg err'; msg.textContent='กรอกอีเมลและรหัสผ่าน'; return; }
  $('btn-login').disabled=true; msg.className='gate-msg'; msg.textContent='กำลังเข้าสู่ระบบ...';
  if(watchdog) clearTimeout(watchdog);
  watchdog=setTimeout(()=>{ if($('gate').style.display!=='none'){ msg.className='gate-msg err'; msg.innerHTML='เชื่อมต่อช้า/ไม่สำเร็จ<br><span style="font-weight:400;font-size:11px">เปิดผ่านลิงก์ https · เช็คเน็ต</span>'; $('btn-login').disabled=false; } },15000);
  try{ await signInWithEmailAndPassword(auth,email,pass); }
  catch(e){ clearTimeout(watchdog); $('btn-login').disabled=false; msg.className='gate-msg err';
    msg.textContent=e.code==='auth/invalid-credential'?'อีเมลหรือรหัสผ่านไม่ถูกต้อง':e.code==='auth/network-request-failed'?'เชื่อมต่อไม่ได้ — เปิดผ่าน https':'ไม่สำเร็จ: '+e.code; }
};
window.doLogout=async function(){ if(unsub){unsub();unsub=null;} await signOut(auth); };

onAuthStateChanged(auth, async(user)=>{
  if(user){
    if(watchdog) clearTimeout(watchdog);
    let profile=null;
    try{
      const snap=await Promise.race([ getDoc(doc(db,'users',user.uid)), new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),15000)) ]);
      if(snap.exists()) profile=snap.data();
    }catch(e){ $('gate-msg').className='gate-msg err'; $('gate-msg').innerHTML='อ่านข้อมูลไม่สำเร็จ<br><span style="font-weight:400;font-size:11px">เปิดผ่าน https · เช็ค Security Rules</span>'; $('btn-login').disabled=false; await signOut(auth); return; }
    if(!profile||profile.active!==true){ $('gate-msg').className='gate-msg err'; $('gate-msg').textContent='บัญชีนี้ยังไม่ได้รับสิทธิ์ (ติดต่อผู้ดูแล)'; $('btn-login').disabled=false; await signOut(auth); return; }
    ME=profile.name||user.email;
    $('gate').style.display='none'; $('app').classList.add('on'); $('who').innerHTML=(profile.name||'')+'<br>'+user.email;
    startListener();
  }else{ $('app').classList.remove('on'); $('gate').style.display='flex'; $('btn-login').disabled=false; $('gate-msg').textContent=''; $('in-pass').value=''; }
});

/* ── Real-time ── */
function startListener(){
  const q=query(patientsCol, orderBy('createdAt','desc'));
  unsub=onSnapshot(q,(snap)=>{ PATIENTS=[]; snap.forEach(d=>PATIENTS.push(Object.assign({id:d.id},d.data()))); renderAll(); },
    (err)=>toast('อ่านข้อมูลไม่ได้: '+err.code));
}
const visible=p=>!p.hidden&&!p.closed;
const byStatus=s=>PATIENTS.filter(p=>visible(p)&&(p.status||'waiting')===s);
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2400); }
window.go=function(tab){ view=tab; document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===tab)); document.querySelectorAll('.page').forEach(p=>p.classList.remove('on')); $('pg-'+tab).classList.add('on'); window.scrollTo(0,0); };

function renderAll(){
  const w=byStatus('waiting'), c=PATIENTS.filter(p=>visible(p)&&['caring','discharge','death'].includes(p.status||'')), u=byStatus('unseen');
  $('b-queue').textContent=w.length; $('b-pc').textContent=c.length; $('b-unseen').textContent=u.length;
  renderQueue(w); renderPC(c); renderUnseen(u);
}

function renderQueue(list){
  list=list.slice().sort((a,b)=>(URG_ORDER[a.urgency]??3)-(URG_ORDER[b.urgency]??3));
  let h=`<div class="ph"><h2>⏳ คิวรอรับ Consult</h2><p>เรียงตามความเร่งด่วน · real-time</p></div>`;
  if(!list.length) h+=`<div class="empty"><div class="ei">✅</div>ไม่มีคิวรอรับ</div>`;
  else h+=list.map((p,i)=>`
    <div class="case waiting">
      <div class="cband"><span class="seq">${i+1}</span><span class="nm">${esc(p.name)}</span>
        <span class="hn">HN ${esc(p.hn)||'-'}</span>${p.regNo?`<span class="reg">${esc(p.regNo)}</span>`:''}
        <span class="urg ${p.urgency==='Emergency'?'em':p.urgency==='Urgency'?'ur':'no'}">${esc(p.urgency)||'-'}</span></div>
      <div class="cbody"><div class="info">🏥 ${esc(p.ward)||'-'}${p.dx?' · 🔬 '+esc(p.dx):''}<div class="d2">${p.reason?'📝 '+esc(p.reason):''}</div></div></div>
      <div class="actbar">
        <div class="agrp"><span class="alabel">สถานะ</span><button class="btn accept" onclick="accept('${p.id}')">🩺 รับ Consult</button></div>
        <div class="agrp"><span class="alabel">จัดการ</span><button class="btn neutral" onclick="openUnseen('${p.id}')">⏱ ปิดเคส</button><button class="btn danger" onclick="del('${p.id}')">🗑 ลบ</button></div>
      </div>
    </div>`).join('');
  $('pg-queue').innerHTML=h;
}
window.accept=async function(id){ await upd(id,{status:'caring'}); toast('รับเคสแล้ว → ทีม PC'); };

function renderPC(list){
  let h=`<div class="ph"><h2>🩺 ทีม PC — กำลังดูแล</h2><p>เปลี่ยนสถานะ · บันทึกทางคลินิก</p></div>`;
  if(!list.length) h+=`<div class="empty"><div class="ei">🩺</div>ยังไม่มีเคสที่รับไว้ดูแล</div>`;
  else h+=list.map(p=>{
    const st=p.status||'caring';
    const nextBtns=st==='caring'
      ? `<button class="btn st" style="color:#6d28d9;border-color:#c4b5fd" onclick="setSt('${p.id}','discharge')">🏠 Discharge</button><button class="btn st" style="color:#374151;border-color:#d1d5db" onclick="setSt('${p.id}','death')">🕊 Death</button>`
      : `<button class="btn st" onclick="setSt('${p.id}','caring')">↩ กลับกำลังดูแล</button>`;
    return `
    <div class="case ${STATUS[st]?STATUS[st].cls:''}">
      <div class="cband"><span class="nm">${esc(p.name)}</span><span class="hn">HN ${esc(p.hn)||'-'}</span>${p.regNo?`<span class="reg">${esc(p.regNo)}</span>`:''}
        <span style="margin-left:auto;font-size:12px;font-weight:700;color:var(--text3)">${STATUS[st]?STATUS[st].label:st}</span></div>
      <div class="cbody"><div class="info">🏥 ${esc(p.ward)||'-'}${p.dx?' · 🔬 '+esc(p.dx):''}</div></div>
      <div class="actbar">
        <div class="agrp"><span class="alabel">สถานะ</span>${nextBtns}</div>
        <div class="agrp"><span class="alabel">บันทึก</span>
          <button class="btn tog${p.opioid?' on-teal':''}" onclick="tog('${p.id}','opioid',${!p.opioid})">💊 Opioid${p.opioid?' ✓':''}</button>
          <button class="btn tog${p.withdrawLS?' on-amber':''}" onclick="tog('${p.id}','withdrawLS',${!p.withdrawLS})">⚕️ WithdrawLS${p.withdrawLS?' ✓':''}</button></div>
        <div class="agrp"><span class="alabel">จัดการ</span><button class="btn danger" onclick="del('${p.id}')">🗑 ลบ</button></div>
      </div>
    </div>`;
  }).join('');
  $('pg-pc').innerHTML=h;
}
window.setSt=async function(id,s){ await upd(id,{status:s}); toast('เปลี่ยนสถานะ → '+(STATUS[s]?STATUS[s].label:s)); };
window.tog=async function(id,f,v){ await upd(id,{[f]:v}); toast(v?'บันทึกแล้ว':'ยกเลิกแล้ว'); };

function renderUnseen(list){
  const by={}; list.forEach(p=>{const r=p.unseenReason||'-';by[r]=(by[r]||0)+1;});
  const brk=Object.keys(by).map(k=>k+' '+by[k]).join(' · ');
  let h=`<div class="ph"><h2>⏱ เคสที่ทีมไปดูไม่ทัน</h2><p>ปิดก่อนทีมได้ประเมิน</p></div><div style="font-size:13px;color:var(--text3);margin-bottom:12px">ทั้งหมด ${list.length} เคส${brk?'  ('+brk+')':''}</div>`;
  if(!list.length) h+=`<div class="empty"><div class="ei">📭</div>ยังไม่มีเคสที่ปิดแบบไปดูไม่ทัน</div>`;
  else h+=list.map(p=>`
    <div class="case unseen">
      <div class="cband" style="background:#f1f5f9"><span class="nm">${esc(p.name)}</span><span class="hn">HN ${esc(p.hn)||'-'}</span>${p.regNo?`<span class="reg">${esc(p.regNo)}</span>`:''}</div>
      <div class="cbody"><div class="info">🏥 ${esc(p.ward)||'-'}${p.dx?' · 🔬 '+esc(p.dx):''}<div class="reason">⏱ เหตุผล: ${esc(p.unseenReason)||'-'}</div></div>
        <button class="btn neutral" style="color:#b45309;border-color:#f59e0b" onclick="setSt('${p.id}','waiting')">↩ ย้ายกลับเข้าคิว</button></div>
    </div>`).join('');
  $('pg-unseen').innerHTML=h;
}

let _uid=null,_ureason=null;
window.openUnseen=function(id){ _uid=id;_ureason=null; const p=PATIENTS.find(x=>x.id===id)||{};
  $('u-name').textContent=(p.name||'')+' · HN '+(p.hn||'-'); $('u-note').style.display='none'; $('u-note').value='';
  $('u-reasons').innerHTML=UNSEEN_REASONS.map(r=>`<div class="ropt" onclick="pickR(this,'${esc(r)}')"><span>${r}</span></div>`).join('');
  $('unseen-ov').classList.add('on'); };
window.pickR=function(el,r){ _ureason=r; document.querySelectorAll('#u-reasons .ropt').forEach(x=>x.classList.remove('sel')); el.classList.add('sel'); $('u-note').style.display=(r==='อื่น ๆ')?'block':'none'; };
window.submitUnseen=async function(){ if(!_ureason){toast('เลือกเหตุผลก่อน');return;} let reason=_ureason; if(reason==='อื่น ๆ'){ const n=$('u-note').value.trim(); if(!n){toast('ระบุเหตุผล');return;} reason='อื่น ๆ: '+n; } await upd(_uid,{status:'unseen',unseenReason:reason}); closeOv('unseen-ov'); toast('ปิดเคสแล้ว'); go('unseen'); };

window.openConsult=function(){
  ['c-name','c-hn','c-age','c-ward','c-dx','c-staging','c-underlying','c-acp','c-reason','c-staff','c-notes'].forEach(i=>$(i).value='');
  ['c-sex','c-pps','c-ecog','c-prognosis','c-goc'].forEach(i=>$(i).value='');
  $('c-urg').value='Urgency';
  $('c-date').value=new Date().toISOString().slice(0,10);
  $('consult-ov').classList.add('on');
};
window.submitConsult=async function(){
  const name=$('c-name').value.trim(); if(!name){ toast('กรอกชื่อผู้ป่วย'); return; }
  const g=id=>$(id).value.trim?$(id).value.trim():$(id).value;
  try{
    await addDoc(patientsCol,{
      name, hn:g('c-hn'), age:g('c-age'), sex:g('c-sex'),
      ward:g('c-ward'), consultDate:g('c-date'), urgency:$('c-urg').value,
      dx:g('c-dx'), staging:g('c-staging'), underlying:g('c-underlying'),
      pps:g('c-pps'), ecog:g('c-ecog'), prognosis:g('c-prognosis'),
      goc:g('c-goc'), acp:g('c-acp'), reason:g('c-reason'),
      staff:g('c-staff'), notes:g('c-notes'),
      status:'waiting', regNo:'', createdBy:ME,
      createdAt:serverTimestamp(), updatedAt:serverTimestamp()
    });
    closeOv('consult-ov'); toast('บันทึกใบ Consult แล้ว'); go('queue');
  }catch(e){ toast('บันทึกไม่สำเร็จ: '+e.code); }
};

async function upd(id,data){ try{ await updateDoc(doc(db,'patients',id), Object.assign({updatedAt:serverTimestamp(),updatedBy:ME},data)); }catch(e){ toast('บันทึกไม่สำเร็จ: '+e.code); } }
window.del=async function(id){ const p=PATIENTS.find(x=>x.id===id)||{}; if(!confirm('ลบเคสนี้?\n\n'+(p.name||'')+' HN '+(p.hn||'-')+'\n(ซ่อนจากทุกหน้า)')) return; await upd(id,{hidden:true}); toast('ลบเคสแล้ว'); };
window.closeOv=function(id){ $(id).classList.remove('on'); };
</script>
</body>
</html>
